name: QML implementation verification

on:
  push:
    branches: [work/qml-menus-icons-preview]

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    container:
      image: thevlang/vlang:ubuntu
      options: --user 0
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: ui2
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 make gcc pkg-config \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxfixes-dev libgl1-mesa-dev libegl-dev libasound2-dev

      - name: Apply feature changes
        run: python3 ui2/.github/apply_qml_feature.py

      - name: Format changed V sources
        run: |
          v fmt -w ui2/ui/ui.v
          v fmt -w ui2/ui/menu.v
          v fmt -w ui2/ui/qml.v
          v fmt -w ui2/ui/qml_model.v
          v fmt -w ui2/ui/qml_menu.v
          v fmt -w ui2/ui/qml_menu_test.v
          v fmt -w ui2/examples/menubar/main.v
          v fmt -w ui2/examples/menubar/menubar_test.v
          v fmt -w ui2/cmd/ui2-qml/main.v
          git -C ui2 diff --check

      - name: Test QML parser and model
        run: |
          v test ui2/ui/qml_test.v
          v test ui2/ui/qml_model_test.v
          v test ui2/ui/qml_menu_test.v

      - name: Test declarative menu example
        run: v test ui2/examples/menubar

      - name: Build QML previewer
        run: v -o /tmp/ui2-qml ui2/cmd/ui2-qml

      - name: Build all Linux examples
        run: v run ui2/examples/build_examples.vsh

      - name: Publish verified feature to master
        shell: bash
        run: |
          cd ui2
          git add README.md ui examples/menubar cmd/ui2-qml
          git diff --cached -- . ':!.github' > /tmp/qml-feature.patch
          test -s /tmp/qml-feature.patch
          git reset --hard origin/master
          git clean -fd
          git apply --check /tmp/qml-feature.patch
          git apply /tmp/qml-feature.patch
          git diff --check
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add README.md ui examples/menubar cmd/ui2-qml
          git commit -m "Declare application menus and icons in QML"
          git push origin HEAD:master
