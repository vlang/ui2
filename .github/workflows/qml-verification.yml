name: QML implementation verification

on:
  push:
    branches: [work/qml-menus-icons-preview]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: ui2
          persist-credentials: false
      - name: Build a garbage-collected verification compiler
        shell: bash
        run: |
          git clone --depth=1 https://github.com/vlang/v v
          git clone --depth=1 https://github.com/vlang/vc v/vc
          git clone --depth=1 --branch thirdparty-linux-amd64 https://github.com/vlang/tccbin v/thirdparty/tcc
          cd v
          cc -std=c99 -w -o v1 vc/v.c -lm -lpthread
          ./v1 -no-parallel -gc boehm -o v cmd/v
          ./v -version
          git rev-parse HEAD
      - name: Package development sources and compiler
        shell: bash
        run: |
          mkdir -p bundle
          cp -a ui2 bundle/ui2
          cp -a v bundle/v
          find bundle -type d -name .git -prune -exec rm -rf '{}' +
          find bundle -type f -name '*.ttf' -delete
          tar -czf qml-development.tar.gz -C bundle ui2 v
      - uses: actions/upload-artifact@v4
        with:
          name: qml-development
          path: qml-development.tar.gz
          retention-days: 1
