name: Adaptive layout tests

on:
  pull_request:
    paths:
      - 'ui/**'
      - 'ide/**'
      - '.github/workflows/adaptive-layout.yml'
  push:
    branches: [master, work/ide-adaptive-layout]
    paths:
      - 'ui/**'
      - 'ide/**'
      - '.github/workflows/adaptive-layout.yml'

permissions:
  contents: read

concurrency:
  group: adaptive-layout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VJOBS: '1'
      V_COMMIT: e650ae91defd1a771d43e27eb0b02c09108d7f09
    steps:
      # The checkout directory name is used to resolve `import ui2`.
      - uses: actions/checkout@v4
        with:
          path: ui2
          persist-credentials: false

      # ui2 master needs a V newer than 0.5.2 (0.5.2 rejects it: see ci.yml). The commit is
      # pinned, not "latest", so that a V regression cannot fail ui2's CI unannounced; move it
      # on purpose, in its own commit, after building ui2 with the new one.
      - name: Install V (pinned master commit)
        shell: bash
        run: |
          git init --quiet "$RUNNER_TEMP/v"
          git -C "$RUNNER_TEMP/v" fetch --quiet --depth 1 https://github.com/vlang/v "$V_COMMIT"
          git -C "$RUNNER_TEMP/v" checkout --quiet FETCH_HEAD
          make -C "$RUNNER_TEMP/v"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/v/v" version

      - name: Install Linux development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --quiet -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxfixes-dev libgl1-mesa-dev libegl-dev libasound2-dev

      - name: Check the IDE
        run: v -check ui2/ide

      - name: Test layout geometry
        run: v test ui2/ui/adaptive_layout_test.v

      - name: Test adaptive VML
        run: v test ui2/ui/vml_adaptive_test.v

      - name: Test designer and generated companion
        run: v test ui2/ide
