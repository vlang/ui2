name: Adaptive layout tests

on:
  pull_request:
    paths:
      - 'ui/**'
      - 'ide/**'
      - '.github/workflows/adaptive-layout.yml'
  push:
    branches: [master, work/ide-adaptive-layout]
    paths:
      - 'ui/**'
      - 'ide/**'
      - '.github/workflows/adaptive-layout.yml'

permissions:
  contents: read

concurrency:
  group: adaptive-layout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VJOBS: '1'
    steps:
      # The checkout directory name is used to resolve `import ui2`.
      - uses: actions/checkout@v4
        with:
          path: ui2
          persist-credentials: false

      - name: Install V 0.5.2
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/v.zip" \
            https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          unzip -q "$RUNNER_TEMP/v.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/v/v" version

      - name: Install Linux development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --quiet -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxfixes-dev libgl1-mesa-dev libegl-dev libasound2-dev

      - name: Check the IDE
        run: v -check ui2/ide

      - name: Test layout geometry
          run: v test ui2/adaptive_layout_test.v

      - name: Test adaptive VML
          run: v test ui2/vml_adaptive_test.v

      - name: Test designer and generated companion
        run: v test ui2/ide
