name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 1,12 * * *'

concurrency:
  # Keep each master commit and manual run; cancel in-progress runs only for PRs.
  # Scheduled runs have their own group so they do not block push runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-examples:
    name: Build examples (${{ matrix.os }}${{ matrix.custom && ', custom renderer' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
          - os: macos-latest
            custom: true
          - os: windows-latest
            custom: true
    env:
      # The V master commit ui2 is built with. Pinned, not "latest": move it on purpose, in its
      # own commit, after building ui2 with the new one. V 0.5.2 cannot build ui2 master (it
      # rejects `array2 = array1`, `uint` in a C declaration, `math.max` with mixed int/f64 and a
      # `void` index that V master accepts), so there is no release to pin to.
      V_COMMIT: e650ae91defd1a771d43e27eb0b02c09108d7f09
    steps:
      - name: Setup V
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git init --quiet "$RUNNER_TEMP/v"
          git -C "$RUNNER_TEMP/v" fetch --quiet --depth 1 https://github.com/vlang/v "$V_COMMIT"
          git -C "$RUNNER_TEMP/v" checkout --quiet FETCH_HEAD
          make -C "$RUNNER_TEMP/v"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/v/v" version

      - name: Setup V
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vdir = Join-Path $env:RUNNER_TEMP 'v'
          git init --quiet $vdir
          git -C $vdir fetch --quiet --depth 1 https://github.com/vlang/v $env:V_COMMIT
          git -C $vdir checkout --quiet FETCH_HEAD
          Push-Location $vdir
          .\make.bat
          Pop-Location
          $vdir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $vdir 'v.exe') version

      # `import ui2` resolves through the checkout directory name, so the
      # repository has to land in a directory called `ui2`.
      - uses: actions/checkout@v4
        with:
          path: ui2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb

      - name: Test component catalog and primitives
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/ui/component_catalog_test.v

      - name: Test VML menu declarations
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/ui/vml_menu_test.v

      - name: Test embedder window API
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/embed_test.v

      - name: Test menu bar and tray scenarios
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/menu_tray_test.v

      - name: Test immediate scrolling
        if: runner.os == 'Linux' || matrix.custom
        run: |
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/ui/ui_scroll_immediate_test.v
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/examples/scrollview

      - name: Test custom renderer pipeline
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/ui/ui_custom_rendering_test.v

      - name: Test C ABI and build C example
        if: runner.os != 'Windows'
        run: |
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/c/api_test.v
          v run ui2/c/build.vsh test ${{ matrix.custom && '-d ui2_custom_rendering' || '' }}
          v run ui2/c/build.vsh example ${{ matrix.custom && '-d ui2_custom_rendering' || '' }}

      - name: Test immediate text clipboard shortcuts
        if: runner.os == 'Linux' || matrix.custom
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/ui/ui_text_clipboard_immediate_test.v

      - name: Build all examples
        run: v run ui2/examples/build_examples.vsh ${{ matrix.custom && '-d ui2_custom_rendering' || '' }}

      - name: Smoke-test custom renderer at runtime
        if: runner.os == 'Linux' && matrix.custom
        run: |
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} -o /tmp/ui2-users-smoke ui2/examples/users
          # The example opens a window and never exits on its own; a clean
          # startup (no abort/assert) that survives a few seconds is a pass.
          xvfb-run -a timeout 15s /tmp/ui2-users-smoke || test $? -eq 124
