name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 1,12 * * *'

concurrency:
  # Keep each master commit and manual run; cancel in-progress runs only for PRs.
  # Scheduled runs have their own group so they do not block push runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-examples:
    name: Build examples (${{ matrix.os }}${{ matrix.custom && ', custom renderer' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            v_asset: v_linux.zip
          - os: macos-latest
            v_asset: v_macos_arm64.zip
          - os: windows-latest
            v_asset: v_windows.zip
          - os: macos-latest
            v_asset: v_macos_arm64.zip
            custom: true
          - os: windows-latest
            v_asset: v_windows.zip
            custom: true
    steps:
      # Pinned post-0.5.2 master: ui2 uses generic math.min/max and newer
      # os APIs that the 0.5.2 release binaries reject. Build from source
      # at a verified commit instead of the 0.5.2 release binaries.
      - name: Setup V
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/vlang/v "$RUNNER_TEMP/v-src"
          git -C "$RUNNER_TEMP/v-src" fetch --depth 1 origin 5b2515a641d4f5c703b2eca04567485bc9909f87
          git -C "$RUNNER_TEMP/v-src" checkout 5b2515a641d4f5c703b2eca04567485bc9909f87
          make -C "$RUNNER_TEMP/v-src"
          echo "$RUNNER_TEMP/v-src" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/v-src/v" version

      - name: Setup V
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/vlang/v (Join-Path $env:RUNNER_TEMP 'v-src')
          $vsrc = Join-Path $env:RUNNER_TEMP 'v-src'
          git -C $vsrc fetch --depth 1 origin 5b2515a641d4f5c703b2eca04567485bc9909f87
          git -C $vsrc checkout 5b2515a641d4f5c703b2eca04567485bc9909f87
          & (Join-Path $vsrc 'make.bat')
          $vsrc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $vsrc 'v.exe') version

      # `import ui2` resolves through the checkout directory name, so the
      # repository has to land in a directory called `ui2`.
      - uses: actions/checkout@v4
        with:
          path: ui2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb

      - name: Test component catalog and primitives
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/component_catalog_test.v

      - name: Test VML menu declarations
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/vml_menu_test.v

      - name: Test embedder window API
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/embed_test.v

      - name: Test menu bar and tray scenarios
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/menu_tray_test.v

      - name: Test immediate scrolling
        if: runner.os == 'Linux' || matrix.custom
        run: |
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/ui_scroll_immediate_test.v
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/examples/scrollview

      - name: Test custom renderer pipeline
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/ui_custom_rendering_test.v

      - name: Test C ABI and build C example
        if: runner.os != 'Windows'
        run: |
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/c/api_test.v
          v run ui2/c/build.vsh test ${{ matrix.custom && '-d ui2_custom_rendering' || '' }}
          v run ui2/c/build.vsh example ${{ matrix.custom && '-d ui2_custom_rendering' || '' }}

      - name: Test immediate text clipboard shortcuts
        if: runner.os == 'Linux' || matrix.custom
        run: v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/ui_text_clipboard_immediate_test.v

      - name: Build all examples
        run: v run ui2/examples/build_examples.vsh ${{ matrix.custom && '-d ui2_custom_rendering' || '' }}

      - name: Smoke-test custom renderer at runtime
        if: runner.os == 'Linux' && matrix.custom
        run: |
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} -o /tmp/ui2-users-smoke ui2/examples/users
          # The example opens a window and never exits on its own; a clean
          # startup (no abort/assert) that survives a few seconds is a pass.
          xvfb-run -a timeout 15s /tmp/ui2-users-smoke || test $? -eq 124
