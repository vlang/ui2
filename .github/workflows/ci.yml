name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '31 1,12 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-examples:
    name: Build examples (${{ matrix.os }}${{ matrix.custom && ', custom renderer' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            v_asset: v_linux.zip
          - os: macos-latest
            v_asset: v_macos_arm64.zip
          - os: windows-latest
            v_asset: v_windows.zip
          - os: macos-latest
            v_asset: v_macos_arm64.zip
            custom: true
          - os: windows-latest
            v_asset: v_windows.zip
            custom: true
    steps:
      # setup-v builds source archives when the requested tree has no checked-in
      # binary. V master currently fails that bootstrap on hosted runners, and
      # the 0.5.2 source bootstrap can pick up an incompatible vc snapshot. Use
      # the official 0.5.2 release binaries instead; 0.5.2 is ui2's documented
      # minimum supported V version.
      - name: Setup V
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/v.zip" \
            "https://github.com/vlang/v/releases/download/0.5.2/${{ matrix.v_asset }}"
          unzip -q "$RUNNER_TEMP/v.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/v" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/v/v" version

      - name: Setup V
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'v.zip'
          Invoke-WebRequest -Uri "https://github.com/vlang/v/releases/download/0.5.2/${{ matrix.v_asset }}" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          $vdir = Join-Path $env:RUNNER_TEMP 'v'
          $vdir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $vdir 'v.exe') version

      # `import ui2` resolves through the checkout directory name, so the
      # repository has to land in a directory called `ui2`.
      - uses: actions/checkout@v4
        with:
          path: ui2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Test immediate scrolling
        if: runner.os == 'Linux' || matrix.custom
        run: |
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/ui/ui_scroll_immediate_test.v
          v ${{ matrix.custom && '-d ui2_custom_rendering' || '' }} test ui2/examples/scrollview

      - name: Build all examples
        run: v run ui2/examples/build_examples.vsh ${{ matrix.custom && '-d ui2_custom_rendering' || '' }}
